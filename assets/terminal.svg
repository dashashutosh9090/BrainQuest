<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450" role="img" aria-label="BrainQuest boot terminal">
  <defs>
    <filter id="tglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="crt" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#FFFFFF" opacity="0.025"/>
    </pattern>
    <linearGradient id="termEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#B026FF"/>
      <stop offset="100%" stop-color="#FF2E97"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="844" height="434" rx="16" fill="#0A0F1A" stroke="url(#termEdge)" stroke-width="1.6"/>
  <rect x="8" y="8" width="844" height="40" rx="16" fill="#101827"/>
  <rect x="8" y="30" width="844" height="18" fill="#101827"/>

  <!-- traffic lights -->
  <circle cx="34" cy="28" r="6.5" fill="#FF5F56"/>
  <circle cx="56" cy="28" r="6.5" fill="#FFBD2E"/>
  <circle cx="78" cy="28" r="6.5" fill="#27C93F"/>
  <text x="430" y="33" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#5C7089">brainquest://mission-control — bootloader v1.0</text>

  <!-- ══ boot sequence (14s loop) ══ -->
  <g font-family="Consolas,'Courier New',monospace" font-size="17">

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.045;0.92;0.955;1" dur="14s" repeatCount="indefinite"/>
      <text x="36" y="86" fill="#7CFF6B">$ <tspan fill="#E6EDF3">./initiate_brainquest --pilot=CHALLENGER</tspan></text>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.10;0.115;0.92;0.955;1" dur="14s" repeatCount="indefinite"/>
      <text x="36" y="122" fill="#00F7FF">&gt; NEURAL LINK ................ <tspan fill="#7CFF6B">[ ✓ ONLINE ]</tspan></text>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.185;0.92;0.955;1" dur="14s" repeatCount="indefinite"/>
      <text x="36" y="158" fill="#00F7FF">&gt; FIREBASE UPLINK ............ <tspan fill="#7CFF6B">[ ✓ CONNECTED ]</tspan></text>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.255;0.92;0.955;1" dur="14s" repeatCount="indefinite"/>
      <text x="36" y="194" fill="#00F7FF">&gt; QUESTION DATABASE .......... <tspan fill="#FFB300">[ 24 SECTORS LOADED ]</tspan></text>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.325;0.92;0.955;1" dur="14s" repeatCount="indefinite"/>
      <text x="36" y="230" fill="#00F7FF">&gt; DIFFICULTY MATRIX .......... [ <tspan fill="#7CFF6B">EASY</tspan> | <tspan fill="#FFB300">MEDIUM</tspan> | <tspan fill="#FF5F56">HARD</tspan> ]</text>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.395;0.92;0.955;1" dur="14s" repeatCount="indefinite"/>
      <text x="36" y="266" fill="#00F7FF">&gt; RETROFIT ANTENNA ........... <tspan fill="#B7C7DB">[ opentdb.com ]</tspan></text>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.465;0.92;0.955;1" dur="14s" repeatCount="indefinite"/>
      <text x="36" y="302" fill="#00F7FF">&gt; LEADERBOARD SATELLITE ...... <tspan fill="#B026FF">[ ◉ IN ORBIT ]</tspan></text>
    </g>

    <!-- sync progress bar -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.535;0.92;0.955;1" dur="14s" repeatCount="indefinite"/>
      <text x="36" y="340" fill="#5C7089">&gt; SYNCING QUESTION BANK</text>
      <rect x="320" y="326" width="300" height="16" rx="8" fill="#121C2E" stroke="#22314A" stroke-width="1"/>
      <rect x="323" y="329" height="10" rx="5" fill="url(#termEdge)">
        <animate attributeName="width" values="0;0;294;294" keyTimes="0;0.53;0.70;1" dur="14s" repeatCount="indefinite"/>
      </rect>
      <text x="636" y="340" fill="#7CFF6B" font-size="15">
        <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.53;0.70;0.72;1" dur="14s" repeatCount="indefinite"/>100%</text>
    </g>

    <!-- final line + blinking cursor -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.755;0.92;0.955;1" dur="14s" repeatCount="indefinite"/>
      <text x="36" y="384" fill="#E6EDF3" filter="url(#tglow)">&gt; ALL SYSTEMS GO — <tspan fill="#00F7FF">WELCOME, CHALLENGER.</tspan></text>
      <rect x="500" y="370" width="11" height="18" fill="#00F7FF">
        <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.835;0.92;0.955;1" dur="14s" repeatCount="indefinite"/>
      <text x="36" y="420" fill="#7CFF6B">$ <tspan fill="#5C7089">press START QUEST to enter the arena_</tspan></text>
    </g>
  </g>

  <!-- CRT scanlines -->
  <rect x="8" y="8" width="844" height="434" rx="16" fill="url(#crt)"/>
</svg>
