<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70" role="img" aria-label="synapse divider">
  <defs>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#B026FF"/>
      <stop offset="82%" stop-color="#FF2E97"/>
      <stop offset="100%" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- brainwave wire -->
  <path id="wave" d="M0 35 H505 L520 35 L531 12 L544 58 L556 20 L566 35 H695 L706 35 L716 18 L728 52 L739 35 H1200"
        fill="none" stroke="url(#wire)" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>

  <!-- traveling bright segment -->
  <path d="M0 35 H505 L520 35 L531 12 L544 58 L556 20 L566 35 H695 L706 35 L716 18 L728 52 L739 35 H1200"
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" filter="url(#dglow)"
        pathLength="1200" stroke-dasharray="70 1130" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="1200;0" dur="3.6s" repeatCount="indefinite"/>
  </path>

  <!-- traveling pulse dot -->
  <circle r="4.6" fill="#FFFFFF" filter="url(#dglow)">
    <animateMotion path="M0 35 H505 L520 35 L531 12 L544 58 L556 20 L566 35 H695 L706 35 L716 18 L728 52 L739 35 H1200" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- end nodes -->
  <g fill="#00F7FF" filter="url(#dglow)">
    <path d="M30 35 l8 -8 8 8 -8 8 Z">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#FF2E97" filter="url(#dglow)">
    <path d="M1154 35 l8 -8 8 8 -8 8 Z">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
