<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="BrainQuest — The Ultimate Trivia Battle Arena">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#0D1526"/>
      <stop offset="55%" stop-color="#080D19"/>
      <stop offset="100%" stop-color="#04060C"/>
    </radialGradient>
    <linearGradient id="titleGrad" gradientUnits="userSpaceOnUse" x1="440" y1="0" x2="1880" y2="0">
      <stop offset="0"      stop-color="#00F7FF"/>
      <stop offset="0.1667" stop-color="#7F52FF"/>
      <stop offset="0.3333" stop-color="#FF2E97"/>
      <stop offset="0.5"    stop-color="#00F7FF"/>
      <stop offset="0.6667" stop-color="#7F52FF"/>
      <stop offset="0.8333" stop-color="#FF2E97"/>
      <stop offset="1"      stop-color="#00F7FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;-720 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#B026FF"/>
      <stop offset="70%" stop-color="#FF2E97"/>
      <stop offset="100%" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#16233B" stroke-width="1" opacity="0.55"/>
    </pattern>
    <style>
      .star{fill:#CFE9FF}
      .tw1{animation:tw 2.8s ease-in-out infinite}
      .tw2{animation:tw 3.7s ease-in-out infinite 0.9s}
      .tw3{animation:tw 4.6s ease-in-out infinite 1.7s}
      @keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
    </style>
  </defs>

  <!-- ══ background ══ -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#grid)"/>

  <!-- ══ starfield ══ -->
  <g>
    <circle class="star tw1" cx="90"  cy="60"  r="1.6"/>
    <circle class="star tw2" cx="210" cy="410" r="1.3"/>
    <circle class="star tw3" cx="330" cy="45"  r="1.8"/>
    <circle class="star tw1" cx="455" cy="430" r="1.2"/>
    <circle class="star tw2" cx="560" cy="70"  r="1.5"/>
    <circle class="star tw3" cx="640" cy="420" r="1.7"/>
    <circle class="star tw1" cx="760" cy="50"  r="1.3"/>
    <circle class="star tw2" cx="880" cy="440" r="1.6"/>
    <circle class="star tw3" cx="990" cy="380" r="1.2"/>
    <circle class="star tw1" cx="1120" cy="330" r="1.5"/>
    <circle class="star tw2" cx="1160" cy="60"  r="1.4"/>
    <circle class="star tw3" cx="60"  cy="330" r="1.4"/>
    <circle class="star tw1" cx="700" cy="140" r="1.1"/>
    <circle class="star tw3" cx="1050" cy="200" r="1.3"/>
  </g>

  <!-- ══ scanline sweep ══ -->
  <rect x="0" y="-120" width="1200" height="120" fill="url(#scanGrad)">
    <animateTransform attributeName="transform" type="translate" values="0 -120;0 600" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- ══ HUD corner brackets ══ -->
  <g stroke="#00F7FF" stroke-width="3" fill="none" opacity="0.65">
    <path d="M22 64V22h42"/>
    <path d="M1178 64V22h-42"/>
    <path d="M22 416v42h42"/>
    <path d="M1178 416v42h-42"/>
    <animate attributeName="opacity" values="0.65;0.25;0.65" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- ══ radar (top right) ══ -->
  <g transform="translate(1095,95)">
    <circle r="38" fill="none" stroke="#1E3A52" stroke-width="1.5"/>
    <circle r="24" fill="none" stroke="#1E3A52" stroke-width="1"/>
    <circle r="10" fill="none" stroke="#1E3A52" stroke-width="1"/>
    <line x1="-38" y1="0" x2="38" y2="0" stroke="#152A3D" stroke-width="1"/>
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#152A3D" stroke-width="1"/>
    <g>
      <path d="M0 0 L38 0 A38 38 0 0 1 32.9 19 Z" fill="#00F7FF" opacity="0.28"/>
      <line x1="0" y1="0" x2="38" y2="0" stroke="#00F7FF" stroke-width="1.6"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite"/>
    </g>
    <circle cx="16" cy="-14" r="2.4" fill="#7CFF6B">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-20" cy="18" r="2.4" fill="#FF2E97">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ══ circuit brain ══ -->
  <g filter="url(#glow)">
    <path d="M260 120 C210 105 165 125 150 165 C110 170 90 205 100 240 C85 275 105 315 145 325 C155 360 200 375 235 355 C270 380 320 370 340 335 C385 330 410 290 395 255 C415 220 400 175 360 165 C350 130 305 105 260 120 Z"
          fill="#0C1626" fill-opacity="0.55" stroke="#00F7FF" stroke-width="2.6" stroke-linecap="round"
          stroke-dasharray="16 10">
      <animate attributeName="stroke-dashoffset" values="26;0" dur="1.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- inner circuitry -->
  <g stroke="#3E5C86" stroke-width="1.6" opacity="0.85" stroke-dasharray="7 6">
    <path d="M180 260 L250 240 L300 190"/>
    <path d="M200 200 L250 240 L280 300"/>
    <path d="M340 220 L320 260 L230 300"/>
    <path d="M300 190 L340 220"/>
    <path d="M180 260 L230 300"/>
    <path d="M200 200 L160 180"/>
    <path d="M320 260 L370 250"/>
    <animate attributeName="stroke-dashoffset" values="13;0" dur="2.2s" repeatCount="indefinite"/>
  </g>

  <!-- synapse nodes -->
  <g fill="#00F7FF" filter="url(#glow)">
    <circle cx="200" cy="200" r="4"><animate attributeName="r" values="3;5.5;3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="240" r="4" fill="#B026FF"><animate attributeName="r" values="3;6;3" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="190" r="4"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="260" r="4" fill="#FF2E97"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="300" r="4"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="300" r="3.4" fill="#7CFF6B"><animate attributeName="r" values="2.6;5;2.6" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="260" r="3.4"><animate attributeName="r" values="2.6;5;2.6" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="220" r="3.4" fill="#FFB300"><animate attributeName="r" values="2.6;5;2.6" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- traveling synapse pulses -->
  <g filter="url(#bigGlow)">
    <circle r="4.5" fill="#FFFFFF">
      <animateMotion path="M180 260 L250 240 L300 190" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#00F7FF">
      <animateMotion path="M200 200 L250 240 L280 300" dur="2.7s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.7s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#FF2E97">
      <animateMotion path="M340 220 L320 260 L230 300" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- chip pins -->
  <g stroke="#3E5C86" stroke-width="2.4" stroke-linecap="round">
    <line x1="225" y1="366" x2="225" y2="392"/>
    <line x1="252" y1="370" x2="252" y2="398"/>
    <line x1="279" y1="366" x2="279" y2="392"/>
  </g>
  <g fill="#00F7FF">
    <rect x="221" y="392" width="8" height="8" rx="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="248" y="398" width="8" height="8" rx="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="275" y="392" width="8" height="8" rx="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- orbiting satellite -->
  <g>
    <ellipse cx="250" cy="240" rx="185" ry="105" fill="none" stroke="#1E3A52" stroke-width="1" stroke-dasharray="4 7"/>
    <g filter="url(#glow)">
      <circle r="5" fill="#FFB300"/>
      <circle r="10" fill="none" stroke="#FFB300" stroke-width="1" opacity="0.5"/>
      <animateMotion path="M435 240 a185 105 0 1 1 -370 0 a185 105 0 1 1 370 0" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ══ title block ══ -->
  <g font-family="Consolas,'Courier New',monospace" font-weight="bold">
    <!-- glitch ghosts -->
    <text x="524" y="252" font-size="92" fill="#FF2E97" opacity="0" textLength="596" lengthAdjust="spacingAndGlyphs">BRAINQUEST
      <animate attributeName="opacity" values="0;0;0.75;0;0;0.55;0;0" keyTimes="0;0.32;0.34;0.37;0.62;0.64;0.67;1" dur="4.5s" repeatCount="indefinite"/>
    </text>
    <text x="516" y="248" font-size="92" fill="#00F7FF" opacity="0" textLength="596" lengthAdjust="spacingAndGlyphs">BRAINQUEST
      <animate attributeName="opacity" values="0;0;0.75;0;0;0.55;0;0" keyTimes="0;0.33;0.35;0.38;0.63;0.65;0.68;1" dur="4.5s" repeatCount="indefinite"/>
    </text>
    <!-- main title -->
    <text x="520" y="250" font-size="92" fill="url(#titleGrad)" filter="url(#glow)" textLength="600" lengthAdjust="spacingAndGlyphs">BRAINQUEST</text>

    <!-- subtitle -->
    <text x="522" y="306" font-size="21" letter-spacing="7" fill="#8FA8C6" textLength="580" lengthAdjust="spacingAndGlyphs">THE ULTIMATE TRIVIA BATTLE ARENA
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.4s" repeatCount="indefinite"/>
    </text>

    <!-- spec line -->
    <text x="522" y="348" font-size="16" fill="#4E617D" letter-spacing="2">v1.0 // KOTLIN x COMPOSE x FIREBASE // 24 SECTORS</text>
  </g>

  <!-- ══ status chip ══ -->
  <g transform="translate(520,378)">
    <rect width="238" height="38" rx="19" fill="#0C1626" stroke="#00F7FF" stroke-width="1.4" opacity="0.9">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="26" cy="19" r="6" fill="#7CFF6B" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="46" y="25" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#7CFF6B" letter-spacing="2">ALL SYSTEMS GO</text>
  </g>

  <!-- ══ bottom energy bar ══ -->
  <rect x="0" y="472" width="1200" height="6" fill="url(#edgeBar)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
