<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="End of transmission">
  <defs>
    <radialGradient id="fbg" cx="50%" cy="20%" r="100%">
      <stop offset="0%" stop-color="#0C1424"/>
      <stop offset="100%" stop-color="#04060C"/>
    </radialGradient>
    <linearGradient id="fbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#B026FF"/>
      <stop offset="75%" stop-color="#FF2E97"/>
      <stop offset="100%" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>
    <filter id="fglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .fs{fill:#CFE9FF}
      .fa{animation:ftw 3.1s ease-in-out infinite}
      .fb{animation:ftw 4.2s ease-in-out infinite 1.1s}
      .fc{animation:ftw 5s ease-in-out infinite 2s}
      @keyframes ftw{0%,100%{opacity:.1}50%{opacity:.9}}
    </style>
  </defs>

  <rect width="1200" height="230" fill="url(#fbg)"/>

  <!-- stars -->
  <g>
    <circle class="fs fa" cx="120" cy="40"  r="1.5"/>
    <circle class="fs fb" cx="300" cy="180" r="1.3"/>
    <circle class="fs fc" cx="480" cy="30"  r="1.6"/>
    <circle class="fs fa" cx="700" cy="190" r="1.2"/>
    <circle class="fs fb" cx="890" cy="45"  r="1.5"/>
    <circle class="fs fc" cx="1080" cy="170" r="1.4"/>
    <circle class="fs fa" cx="1160" cy="60" r="1.2"/>
    <circle class="fs fb" cx="60"  cy="150" r="1.3"/>
  </g>

  <!-- brainwave -->
  <path d="M0 60 H470 L484 60 L495 34 L508 84 L521 44 L532 60 H668 L680 60 L691 40 L703 76 L714 60 H1200"
        fill="none" stroke="url(#fbar)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M0 60 H470 L484 60 L495 34 L508 84 L521 44 L532 60 H668 L680 60 L691 40 L703 76 L714 60 H1200"
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" filter="url(#fglow)"
        pathLength="1200" stroke-dasharray="60 1140" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="1200;0" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- main sign-off -->
  <g font-family="Consolas,'Courier New',monospace" text-anchor="middle">
    <text x="600" y="135" font-size="30" letter-spacing="8" fill="#00F7FF" filter="url(#fglow)" font-weight="bold">◢ END OF TRANSMISSION ◣
      <animate attributeName="opacity" values="1;1;0.25;1;1;0.55;1" keyTimes="0;0.42;0.45;0.5;0.78;0.8;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="172" font-size="16" letter-spacing="4" fill="#B026FF">SEE YOU ON THE LEADERBOARD, CHALLENGER
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="200" font-size="12" letter-spacing="3" fill="#4E617D">SIGNAL 100% · CHANNEL brainquest/master · re-run quiz to reconnect</text>
  </g>

  <!-- blinking record dot -->
  <circle cx="60" cy="35" r="6" fill="#FF5F56" filter="url(#fglow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="76" y="40" font-family="Consolas,monospace" font-size="13" fill="#5C7089">REC</text>

  <!-- bottom energy bar -->
  <rect x="0" y="224" width="1200" height="6" fill="url(#fbar)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
